# 服务端配置文件

# 媒体目录路径
media_dir=./meduim/meduim_data

# 组播配置
multicast_group=224.1.1.1
multicast_port=8888

# 令牌桶限速参数
token_burst_bytes=12288
token_refill_bytes_per_tick=1600

# 节目单广播间隔（秒）
list_broadcast_interval=5

# 日志配置
log_level=INFO
log_file=
log_use_color=1
log_show_timestamp=1
log_show_thread_id=0

# 守护进程模式（0=前台，1=后台）
daemon_mode=0
